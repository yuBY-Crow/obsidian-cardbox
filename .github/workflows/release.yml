name: Release Obsidian Plugin

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

env:
  PLUGIN_NAME: cardbox-mobile

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const v = require('./manifest.json').version; if (v === process.env.TAG) { console.log('version OK: ' + v); } else { console.error('tag ' + process.env.TAG + ' does not match manifest version ' + v); process.exit(1); }"

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Test
        run: npm test

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            main.js manifest.json styles.css