name: Release Obsidian Plugin

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

env:
  PLUGIN_NAME: cardbox-mobile

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const v = require('./manifest.json').version; if (v === process.env.TAG) { console.log('version OK: ' + v); } else { console.error('tag ' + process.env.TAG + ' does not match manifest version ' + v); process.exit(1); }"

      - name: Build
        id: build
        run: |
          npm ci
          npm run build
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}
          ls -la

      - name: Test
        run: npm test

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            ${{ env.PLUGIN_NAME }}.zip
          gh release upload "${{ github.ref_name }}" main.js manifest.json styles.css --clobber
